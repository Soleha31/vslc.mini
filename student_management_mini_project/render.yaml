services:
  - type: web
    name: student-management-system
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: student-management-db
          property: connectionString

databases:
  - name: student-management-db
    plan: basic-256mb
